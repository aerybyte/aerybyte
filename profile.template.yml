# ================================
# PROFILE TEMPLATE (EDIT THIS FILE)
# ================================
# This is the one file most people need to edit.
# The workflow reads this template to build README.md and SVG assets.

profile:
  # Optional: set the GitHub account to sync stats/avatar from.
  # Leave blank to use the repository owner.
  github_username: ""

  # Your headline role text
  card_title: "eri reilly"
  role: "Software Engineer"

  # Optional short line under role (blank hides it)
  tagline: ""

  # Contact metadata; named cards surface Discord in the profile block.
  discord: "@aeiree"
  email: ""

  # Add any extra fields you want to appear in the named profile block.
  # Example: pronouns, location, portfolio, current_focus, etc.
  additional_fields:
    focus: "Full-Stack Systems · Applied AI · Infrastructure"
    education: "Rutgers University — CS + Marketing"

  # Optional: hide built-in personal fields by label.
  # Example values: role, tagline, human uptime, timezone, pronouns
  disabled_fields:
    - handle
    - human uptime
    - timezone

  # Optional: add more contact fields under [contact].
  # Example: linkedin, website, x, telegram
  contact_fields:
    linkedin: ""

  # Optional fields that can be shown if toggled below
  show_location: false
  show_website: true

sections:
  # This section powers [top skills] in README
  stack:
    languages: "TypeScript · Python · JavaScript · SQL"
    frontend: "React · React Native · Vite · Capacitor · Next.js"
    backend: "Node.js · PostgreSQL · Supabase · PostGIS · SQLite"
    ai: "RAG · Open WebUI · LLM Tool Calling · NLP"
    infra: "Docker · Kubernetes · gVisor · GitHub Actions · UniFi"
    testing: "Jest · Supertest · Playwright · Appium"
    platforms: "SAP · Firebase · GitHub · GitLab · Jira · New Relic"

  current systems:
    WOE: "SAP-connected ordering · web / iOS / Android"
    Wilbur: "Internal RAG assistant · secure AI workbench"
    ATP: "Geospatial social platform · React Native / PostGIS"

uptime:
  label: "human uptime"

  # custom = use start_date below (or PROFILE_START_DATE secret)
  # github_account = use GitHub account creation date
  source: "custom"

  start_date: "2004-07-13"

  # Use any IANA timezone for DST-aware output.
  # Examples: America/New_York, Europe/London, Asia/Tokyo, Australia/Sydney
  timezone: "America/New_York"
  timezone_display: "Eastern Time"
  precision: "days"

display:
  top_languages: 4
  exclude_languages:
    - HTML
    - CSS

  # Stats collection lookback window
  contributions_window_days: 365

  # Order of metadata sections in README/SVG
  readme_section_order:
    - eri reilly
    - stack
    - current systems
    - github stats

  readme_info_column_width: 68
  readme_compact: true
  show_public_email: false

  # Avatar source controls
  avatar_path: ""
  avatar_cache_path: "assets/avatar.png"

theme:
  accent: "#f97316"
  accent_2: "#14b8a6"

preview:
  # Used by --offline mode only.
  name: "your-name"
  public_repos: 1
  stars: 0

runtime_managed:
  # These are generated by the cron workflow; do not edit here.
  github_stats: "AUTO (repositories, commits, + / -, lines of code, scope)"
  next_refresh_at: "AUTO (from cron schedule + timezone)"
  timezone_suffix: "AUTO (EST/EDT and UTC offset)"
